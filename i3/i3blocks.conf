[volume]
label=
command=/usr/lib/i3blocks/volume
#color=#a8eb3c
color=#Ea83B6
interval=once
signal=10
# separator=false

# [media]
# command=/usr/lib/i3blocks/mediaplayer
# instance=audacious
# interval=once
# signal=10
# color=#d33682

[memory]
label=
command=/usr/lib/i3blocks/memory
separator=false
interval=15
color=#009900

[load_average]
command=~/.config/i3/blocks/load_average
color=#009900
interval=10

[bandwidth]
label=
color=#859900
command=/usr/lib/i3blocks/bandwidth
interval=5
separator=false

[iface]
command=~/.config/i3/blocks/iface
interval=15
color=#859900

[public_ip]
command=~/.config/i3/blocks/public_ip
format=json
interval=30

[date]
command=~/.config/i3/blocks/calendar
interval=15
label=
color=#dddddd
