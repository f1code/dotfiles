# (link this to ~/.tmux.conf)

# Use Ctrl-S for commands
unbind C-b
set -g prefix C-s

# --- General Settings ---

# Enable mouse support (clicking tabs, resizing panes, scrolling)
set -g mouse on
bind m set -g mouse on \; display "MOUSE ON"
bind M set -g mouse off \; display "MOUSE OFF"
#set -ga terminal-overrides ':Ss=\eE[%p1%d q:Se=\eE[2 q'
#set -ga terminal-overrides ':Ss=\eE[2 q:Se=\eE[6 q'

# Increase scrollback buffer (default is too small for long logs)
set -g history-limit 50000

# Start window and pane numbering at 1 (instead of 0, which is far on the keyboard)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

set-window-option -g mode-keys vi
set-window-option -g automatic-rename on
set -g set-titles on

# Set colors
# does not seem necessary anymore.  
# Test with https://gist.githubusercontent.com/HaleTom/89ffe32783f89f403bba96bd7bcd1263/raw/e50a28ec54188d2413518788de6c6367ffcea4f7/print256colours.sh
# set-option -g default-terminal "screen-256color"

set-option -g display-panes-time 3000

# important to prevent delay switching mode in vim
set -s escape-time 0

# --- Key Bindings ---

# Set reload key to r
bind r source-file ~/.tmux.conf \; display "Config Reloaded"

# Split panes using | and - (much more intuitive than % and ")
# These also open the new pane in the current working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Remap pane navigation to vim (with prefix)
unbind-key k
bind-key k select-pane -U
unbind-key h
bind-key h select-pane -L
unbind-key j
bind-key j select-pane -D
unbind-key l
bind-key l select-pane -R
# Cycle through panes
bind -n M-n select-pane -t :.+  # Alt + n for Next pane
bind -n M-p select-pane -t :.-  # Alt + p for Previous pane
# Resize panes using Prefix + Arrow Keys (5 cells at a time)
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# # Colemak style
# unbind-key e
# bind-key e select-pane -D
# unbind-key u
# bind-key u select-pane -U
# unbind-key n
# bind-key n select-pane -L
# unbind-key i
# bind-key i select-pane -R

# Window switching
# Default is n, p for next, previous window (with prefix)
bind -n C-M-n previous-window
bind -n C-M-p next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Incremental search in vi-mode
bind-key -T copy-mode-vi / command-prompt -i -p "(search down)" "send -X search-forward-incremental \"%%%\""
bind-key -T copy-mode-vi ? command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""
# One-key search (Prefix + f)
bind f copy-mode \; command-prompt -i -p "(search up)" "send -X search-backward-incremental \"%%%\""

# --- Status bar ---
set -g status on
# Design the status bar (Bottom bar)
set -g status-style bg=black,fg=cyan
set -g status-left-length 20
set -g status-left '#[fg=green](#S) ' # Shows session name
set -g status-right '#[fg=yellow]%Y-%m-%d %H:%M ' # Shows date/time

# Highlight the active window in the status bar
set-window-option -g window-status-current-style bg=cyan,fg=black

